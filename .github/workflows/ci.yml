name: CI

# validate  ->  test  ->  docker
# Each job starts only if the previous one succeeded (enforced with `needs:`).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. validate
  validate:
    name: validate (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Check executable permissions are committed
        run: |
          bad=0
          for f in grade.sh app/app.sh scripts/lint.sh scripts/build.sh tests/test.sh; do
            mode="$(git ls-files --stage -- "$f" | cut -d' ' -f1)"
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::not executable in git (mode '$mode'). Fix: git update-index --chmod=+x $f"
              bad=1
            fi
          done
          exit "$bad"

      - name: Lint (required files, bash -n, ShellCheck)
        run: ./scripts/lint.sh

      - name: Lint Dockerfile (Hadolint)
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          # DL3008 (pin apt package versions) is ignored: pinned versions disappear from Debian mirrors
          ./hadolint --ignore DL3008 Dockerfile

  # ------------------------------------------------------------------- 2. test
  test:
    name: test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Run tests
        run: ./tests/test.sh

  # ----------------------------------------------------------------- 3. docker
  docker:
    name: docker (build and smoke test)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the image and run smoke tests
        run: ./scripts/build.sh

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Smoke test - docker compose run
        run: docker compose run --rm devops-tool system-info

