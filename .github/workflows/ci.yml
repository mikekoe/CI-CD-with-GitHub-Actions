name: CI

# validate  ->  test  ->  docker
# Each job starts only if the previous one succeeded (enforced with `needs:`).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. validate
  validate:
    name: validate (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          missing=0
          for f in README.md app/diagnostic.sh app/health-check.sh Dockerfile compose.yaml .dockerignore test.sh grade.sh; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check executable permissions are committed
        run: |
          bad=0
          for f in grade.sh test.sh app/diagnostic.sh app/health-check.sh; do
            mode="$(git ls-files --stage -- "$f" | cut -d' ' -f1)"
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::not executable in git (mode '$mode'). Fix: git update-index --chmod=+x $f"
              bad=1
            fi
          done
          exit "$bad"

      - name: Bash syntax check (bash -n)
        run: |
          for f in app/*.sh test.sh grade.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Lint Bash scripts (ShellCheck)
        run: shellcheck -x app/*.sh test.sh grade.sh

      - name: Lint Dockerfile (Hadolint)
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          # DL3008 (pin apt package versions) is ignored: pinned versions disappear from Debian mirrors
          ./hadolint --ignore DL3008 Dockerfile

  # ------------------------------------------------------------------- 2. test
  test:
    name: test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run application tests
        run: ./test.sh --no-docker

  # ----------------------------------------------------------------- 3. docker
  docker:
    name: docker (build and smoke test)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t diagnostic-tool .

      - name: Smoke test - help
        run: docker run --rm diagnostic-tool help

      - name: Smoke test - system
        run: docker run --rm diagnostic-tool system

      - name: Smoke test - disk
        run: docker run --rm diagnostic-tool disk

      - name: Smoke test - invalid command exits with code 2
        run: |
          rc=0
          docker run --rm diagnostic-tool notacommand || rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 2 ]

      - name: Smoke test - container health check
        run: docker run --rm --entrypoint /app/health-check.sh diagnostic-tool

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Smoke test - docker compose run
        run: docker compose run --rm diagnostic system

      - name: Run the full test suite against the image
        run: ./test.sh
