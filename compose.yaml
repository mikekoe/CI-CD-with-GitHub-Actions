name: devops-tool

services:
  devops-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-tool:latest
    # Default command; override per run, e.g.:
    #   docker compose run --rm devops-tool check-host example.com
    command: ["help"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW        # lets ping send ICMP as the non-root user
